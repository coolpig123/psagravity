[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hindcast"
version = "0.1.0"
description = "Hindcast: does the spread model predict where real fires went (vs FEDS perimeters)"
requires-python = ">=3.11"
# + firespread and geelayers: pip install -e ../gee_layers -e ../spread_model
dependencies = ["numpy>=2.0", "pandas>=2.2", "xarray>=2024.1", "scipy>=1.11", "h5netcdf>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
hindcast = ["templates/*.html"]
