[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geelayers"
version = "0.1.0"
description = "Terrain, fuel, dryness and weather layers from Google Earth Engine for fire-spread modelling"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.7",
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "scipy>=1.12",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geelayers = "geelayers.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
